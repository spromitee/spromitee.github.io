<title>Food Tracker</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#e2e8f0; --dim:#94a3b8; --acc:#38bdf8; --good:#4ade80; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:10; background:rgba(15,23,42,.95); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:12px 16px; }
  header h1 { margin:0 0 2px; font-size:20px; }
  header p { margin:0; color:var(--dim); font-size:12px; }
  .wrap { max-width:900px; margin:0 auto; padding:12px 16px 40px; }
  .tabs { display:flex; gap:8px; }
  .tabs button { flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--txt); font-size:14px; cursor:pointer; }
  .tabs button.on { background:var(--acc); border-color:var(--acc); color:#082f49; font-weight:700; }
  .weeknav { display:flex; gap:8px; align-items:center; margin-top:12px; }
  .weeknav button { padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--txt); font-size:14px; cursor:pointer; }
  .weeknav span { flex:1; text-align:center; color:var(--dim); font-size:13px; }
  .progress { margin-top:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .progress .nums { font-size:14px; margin-bottom:8px; }
  .progress .nums b { color:var(--good); }
  .bar { height:8px; border-radius:4px; background:#0f172a; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--good); width:0; }
  .day { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:10px; }
  .day.today { border-color:var(--acc); }
  .day h2 { margin:0 0 2px; font-size:16px; line-height:1.35; }
  .day h2 .tag { font-size:11px; font-weight:700; color:#082f49; background:var(--acc); border-radius:20px; padding:2px 8px; vertical-align:2px; margin-left:6px; }
  .day .meta { color:var(--dim); font-size:13px; margin-bottom:10px; }
  .meal { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line); cursor:pointer; }
  .meal:first-of-type { border-top:none; }
  .meal input { width:20px; height:20px; margin:2px 0 0; accent-color:var(--good); flex:none; cursor:pointer; }
  .meal .label { font-size:12px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; width:74px; flex:none; padding-top:3px; }
  .meal .food { font-size:14px; line-height:1.45; }
  .meal.done .food { text-decoration:line-through; opacity:.6; }
  .guide { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:10px; font-size:13px; color:var(--dim); line-height:1.6; }
  .guide h3 { margin:0 0 8px; font-size:15px; color:var(--txt); }
  .guide b { color:var(--txt); }
  .guide ol, .guide ul { margin:6px 0 0; padding-left:20px; }
  .guide li { margin-bottom:4px; }
  .guide li b { color:var(--txt); }
  .guide table { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
  .guide th, .guide td { text-align:left; padding:6px 4px; border-top:1px solid var(--line); vertical-align:top; }
  .guide th { color:var(--txt); }
  .guide a { color:var(--acc); }
  .tips { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:10px; font-size:13px; color:var(--dim); line-height:1.6; }
  .photos { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:8px; }
  .photos figure { margin:0; border-radius:12px; overflow:hidden; border:1px solid var(--line); background:#0f172a; }
  .photos img { width:100%; height:110px; object-fit:cover; display:block; }
  .photos figcaption { padding:8px 10px; font-size:12px; line-height:1.45; }
  .photos figcaption b { display:block; color:var(--txt); font-size:13px; margin-bottom:2px; }
  .matrix { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:8px; }
  .matrix div { border:1px solid var(--line); border-radius:10px; padding:10px; }
  .matrix h4 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .matrix ul { margin:0; padding-left:16px; }
  .matrix li { margin-bottom:5px; }
  @media (max-width:640px) { .photos { grid-template-columns:1fr; } .matrix { grid-template-columns:1fr; } }
  .tips b { color:var(--txt); }
  footer { margin-top:16px; font-size:12px; color:var(--dim); line-height:1.6; }
  .clear { margin-top:12px; width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--dim); font-size:13px; cursor:pointer; }
</style>
